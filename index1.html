
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лабораторная работа — AR.js</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js 3.4.8 -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="antialias: true; alpha: true"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- Маркер Hiro -->
        <a-marker
            id="hiro-marker"
            preset="hiro"
            emitevents="true">

            <!-- Куб -->
            <a-box
                position="-0.25 0.15 0"
                scale="0.3 0.3 0.3"
                color="#4CC3D9">
            </a-box>

            <!-- Торус -->
            <a-torus-knot
                position="0.25 0.18 0"
                scale="0.35 0.35 0.35"
                radius="0.3"
                radius-tubular="0.08"
                color="#EF2D5E">
            </a-torus-knot>

            <!-- Blender-модель добавим после проверки -->
            <!--
            <a-entity
                gltf-model="url(scene1.glb)"
                position="0 0 0"
                scale="0.005 0.005 0.005"
                rotation="0 0 0">
            </a-entity>
            -->

        </a-marker>

        <!-- Камера -->
        <a-entity camera></a-entity>

    </a-scene>

    <!-- Диагностика распознавания маркера -->
    <script>
        const marker = document.querySelector("#hiro-marker");

        marker.addEventListener("markerFound", () => {
            console.log("Hiro marker FOUND");
        });

        marker.addEventListener("markerLost", () => {
            console.log("Hiro marker LOST");
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ЛР4 — AR.js + A-Frame</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js (marker-based, версия для A-Frame) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>
  <!-- arjs: параметры AR.js; detectionMode/ matrixCodeType нужны только для barcode-маркеров -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

    <!-- Маркер Hiro. Всё, что внутри <a-marker>, привязано к маркеру -->
    <a-marker preset="hiro">

      <!-- Простая модель (появляется над маркером)  -->
      <a-box position="0 0.5 0" scale="0.008 0.08 0.08" color="#4CC3D9">
      </a-box>

      <!-- Модель "около маркера" — сбоку от него -->
      <a-torus-knot position="1.5 0.6 0" radius="0.3" radius-tubular="0.08" color="#EF2D5E">
      </a-torus-knot>

      <!-- Своя модель из Blender (.glb). Раскомментируйте и положите файл рядом с index.html.
           Подберите scale и position под размер вашей модели. -->
  
      <a-entity gltf-model="url(scene1.glb)"
                position="0 0 0"
                scale="0.0005 0.0005 0.0005"
                rotation="90 180 0">
      </a-entity>


    </a-marker>

    <!-- Камера (обязательно, в конце сцены) -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
